<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<meta name="description" content="QuizEarn — answer quiz questions, build streaks, and earn coins." />
<title>QuizEarn</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" />
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
<link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">Q</span>
      <span class="brand-name">Quiz<em>Earn</em></span>
    </div>
    <div class="wallet" id="wallet" title="Your coin balance">
      <span class="coin" aria-hidden="true"></span>
      <span id="coin-balance">0</span>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Main navigation">
    <button class="tab" data-route="home" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
      <span data-i18n="tab.home">Home</span>
    </button>
    <button class="tab" data-route="play" aria-label="Play">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4.5v15l12-7.5z"/></svg>
      <span data-i18n="tab.play">Play</span>
    </button>
    <button class="tab" data-route="reward" aria-label="Reward">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
      <span data-i18n="tab.reward">Reward</span>
    </button>
    <button class="tab" data-route="profile" aria-label="Profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4 0-7 2.2-7 5v1h14v-1c0-2.8-3-5-7-5z"/></svg>
      <span data-i18n="tab.profile">Profile</span>
    </button>
  </nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
